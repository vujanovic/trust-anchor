spring.application.name=trustanchor

spring.datasource.url=jdbc:postgresql://localhost:5432/trustanchor
spring.datasource.username=postgres
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.profiles.active=dev
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.debug=true
spring.mail.from=no-reply@voom.local

spring.cloud.vault.uri=${VAULT_ADDR:http://localhost:8200}
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.token=${VAULT_TOKEN:dev-only-token}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=application
spring.cloud.vault.kv.application-name=application
spring.cloud.vault.kv.profiles=

spring.config.import=optional:file:./application-local.properties,vault://

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

jwt.expiration-ms=900000

app.frontend.url=https://localhost:5173
app.crl.url=https://localhost:8080/api/v1/crl

server.ssl.key-store=${KEYSTORE:src/main/resources/localhost server.p12}
server.ssl.key-store-password=${KEYSTORE_PASSWORD:sifra123}


#app.crl.url=https://localhost:8443/api/v1/crl
# Master key rotation: 03:00 on the 1st of every 6th month (Jan/Jul).
# Demo override example: 0 */2 * * * * (every 2 minutes)
master-key.rotation.cron=0 0 3 1 */6 *

